name: Build SFZ Tool Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-22.04
            target: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (Linux GUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1-mesa-glx

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ -f "SFZ_Tool.py" ]; then
            pyinstaller --noconfirm --onefile --windowed --hidden-import=tkinter --hidden-import=csv --hidden-import=pathlib SFZ_Tool.py
          elif [ -f "SFZ_Tool/SFZ_Tool.py" ]; then
            pyinstaller --noconfirm --onefile --windowed --hidden-import=tkinter --hidden-import=csv --hidden-import=pathlib SFZ_Tool/SFZ_Tool.py
          else
            echo "Searching for python scripts in workspace:"
            find . -name "*.py"
            echo "Error: Main script not found!"
            exit 1
          fi

      - name: Rename Executable (Safe Cross-Platform Naming)
        shell: bash
        run: |
          mkdir -p dist_final
          if [ "${{ matrix.target }}" == "windows" ]; then
            mv dist/*.exe dist_final/SFZ_Tool-windows.exe
          elif [ "${{ matrix.target }}" == "macos" ]; then
            mv dist/SFZ_Tool dist_final/SFZ_Tool-macos
          else
            mv dist/SFZ_Tool dist_final/SFZ_Tool-linux
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist_final/SFZ_Tool-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/build-windows/SFZ_Tool-windows.exe
            artifacts/build-macos/SFZ_Tool-macos
            artifacts/build-linux/SFZ_Tool-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}